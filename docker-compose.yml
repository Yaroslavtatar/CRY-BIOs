version: '3.8'

services:
  cry-bios:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cry_bios_app
    restart: always
    ports:
      # Только локальный интерфейс: наружу — через обратный прокси (Traefik/nginx).
      # Чтобы открыть порт напрямую, задайте BIND_ADDRESS=0.0.0.0 (тогда IP-лимиты зависят от TRUST_PROXY).
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Раскомментируйте и настройте по необходимости:
      # - GEMINI_API_KEY=your_key_here
      - APP_URL=https://cbios.ru
      - BIO_BASE_DOMAIN=cbios.ru
      # Пароль админ-панели. Если не задан и нет сохранённого пароля, при первом запуске
      # генерируется случайный и печатается в логах контейнера (docker logs cry_bios_app).
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - cry_bios_data:/app/data

volumes:
  cry_bios_data:
    driver: local
