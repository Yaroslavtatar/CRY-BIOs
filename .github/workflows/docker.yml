name: Docker Build and Publish

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    name: Build, smoke-test, publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # Сначала собираем образ локально и проверяем, что контейнер реально стартует и здоров
      - name: Build image (local, for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cry-bios:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name cry-bios-ci -p 3000:3000 \
            -e ADMIN_PASSWORD=ci-smoke-password-123 \
            -e APP_URL=http://127.0.0.1:3000 \
            cry-bios:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              echo "Container healthy"; exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy"; docker logs cry-bios-ci; exit 1

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy:
    name: Deploy to production (Coolify)
    needs: build-and-push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Trigger Coolify deploy
        id: trigger
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::notice::COOLIFY_WEBHOOK_URL / COOLIFY_TOKEN не заданы — деплой пропущен"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_WEBHOOK_URL}"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Wait for the new version to be healthy
        if: steps.trigger.outputs.skipped == 'false'
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::notice::vars.HEALTH_URL не задана — проверка здоровья пропущена"; exit 0
          fi
          sleep 30
          for i in $(seq 1 30); do
            if curl -fsS "$HEALTH_URL" >/dev/null; then
              echo "Production healthy"; exit 0
            fi
            sleep 10
          done
          echo "::error::Production не ответил на ${HEALTH_URL} после деплоя"; exit 1
